name: Build macOS candidate (unverified)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-candidate:
    name: macOS build only (unverified candidate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/release_version.py
      - name: Set up Godot
        id: godot
        run: python scripts/setup_godot_ci.py --github-output
      - name: Build architecture-labeled candidate (no runtime acceptance)
        env:
          GODOT_BIN: ${{ steps.godot.outputs.godot_bin }}
        run: python scripts/build_portable.py --target macos
      - uses: actions/upload-artifact@v4
        with:
          name: mascotmate-macos-candidate-unverified
          if-no-files-found: error
          path: |
            dist/MascotMateDesktop-macos-*-candidate.zip
            dist/MascotMateDesktop-macos-*-candidate.zip.sha256
