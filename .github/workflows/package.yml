name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate scripts and resources
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('*.py')]"
          python -m unittest discover tests
          python scripts/generate_godot_manifest.py --check
          python scripts/validate_resources.py
          python scripts/validate_skin_catalog.py --check

      - name: Set up Godot
        id: godot
        run: python scripts/setup_godot_ci.py --github-output

      - name: Godot headless tests
        env:
          GODOT_BIN: ${{ steps.godot.outputs.godot_bin }}
        run: python scripts/run_godot_smoke.py

      - name: Build portable package
        env:
          GODOT_BIN: ${{ steps.godot.outputs.godot_bin }}
        run: python scripts/build_portable.py --target ${{ matrix.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mascotmate-desktop-${{ matrix.target }}
          path: dist/MascotMateDesktop-*.zip

  release:
    name: Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: mascotmate-desktop-*
          merge-multiple: true

      - name: Write release notes header
        shell: bash
        run: |
          release_base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > release-body.md <<EOF
          # MascotMate Desktop ${GITHUB_REF_NAME}

          Download a portable package for your system, extract the entire ZIP, and run the app from the extracted folder. There is no installer.

          | Platform | Download |
          | --- | --- |
          | Windows x86_64 | [MascotMateDesktop-windows-x86_64.zip](${release_base}/MascotMateDesktop-windows-x86_64.zip) |
          | macOS universal | [MascotMateDesktop-macos-universal.zip](${release_base}/MascotMateDesktop-macos-universal.zip) |
          | Linux x86_64 | [MascotMateDesktop-linux-x86_64.zip](${release_base}/MascotMateDesktop-linux-x86_64.zip) |

          Keep the extracted folder intact. On macOS, keep `MascotMateDesktop.app` inside the extracted folder instead of moving the app bundle by itself.

          Each package includes a `README.txt` with first-run controls and troubleshooting notes.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: release-assets/MascotMateDesktop-*.zip
