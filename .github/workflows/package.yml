name: Package candidates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Accept ${{ matrix.target }} ZIP
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source and version
        shell: bash
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('*.py')]"
          python -m unittest discover tests
          python scripts/release_version.py
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then python scripts/release_version.py --tag "$GITHUB_REF_NAME"; fi
          python scripts/generate_godot_manifest.py --check
          python scripts/validate_resources.py
          python scripts/validate_skin_catalog.py --check
      - name: Set up Godot
        id: godot
        run: python scripts/setup_godot_ci.py --github-output
      - name: Godot tests
        env:
          GODOT_BIN: ${{ steps.godot.outputs.godot_bin }}
        run: python scripts/run_godot_smoke.py
      - name: Build public ZIP
        env:
          GODOT_BIN: ${{ steps.godot.outputs.godot_bin }}
        run: python scripts/build_portable.py --target ${{ matrix.target }} --require-clean
      - name: Install Linux desktop acceptance tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox picom xclip libgl1-mesa-dri
      - name: Accept extracted Linux ZIP on a desktop
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension COMPOSITE" bash -c '
            openbox >/tmp/openbox.log 2>&1 &
            picom --backend xrender >/tmp/picom.log 2>&1 &
            sleep 2
            python scripts/verify_package.py dist/MascotMateDesktop-linux-x86_64.zip --report dist/acceptance-linux.json
          '
      - name: Accept extracted Windows ZIP on a desktop
        if: runner.os == 'Windows'
        run: python scripts/verify_package.py dist/MascotMateDesktop-windows-x86_64.zip --report dist/acceptance-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: mascotmate-desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/MascotMateDesktop-${{ matrix.target }}-x86_64.zip
            dist/MascotMateDesktop-${{ matrix.target }}-x86_64.zip.sha256
            dist/acceptance-${{ matrix.target }}.json

  release:
    name: Publish accepted tag
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: mascotmate-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify original accepted artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_version.py --tag "$RELEASE_TAG"
          python scripts/prepare_release.py release-assets --commit "$GITHUB_SHA" --notes release-body.md
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Publish latest release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "MascotMate Desktop $RELEASE_TAG" --notes-file release-body.md --generate-notes \
            release-assets/MascotMateDesktop-windows-x86_64.zip \
            release-assets/MascotMateDesktop-linux-x86_64.zip \
            release-assets/SHA256SUMS.txt \
            release-assets/acceptance-windows.json \
            release-assets/acceptance-linux.json
